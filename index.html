<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ay& Coffee - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Sembunyikan scrollbar untuk tampilan seperti aplikasi asli */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -ms-overflow-style: none; scrollbar-width: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f2f2f7; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 85px); }
        .ios-blur { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
    </style>
</head>
<body class="text-gray-900 antialiased selection:bg-amber-200">

    <div class="app-container flex flex-col h-screen overflow-hidden">
        
        <!-- Header (iOS Style) -->
        <header class="ios-blur pt-safe border-b border-gray-200/50 sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
            <div class="w-8"></div> <!-- Spacer untuk title menengah -->
            <h1 class="text-[17px] font-semibold tracking-tight text-black">Ay&</h1>
            <i data-lucide="coffee" class="w-6 h-6 text-amber-600"></i>
        </header>

        <!-- Product Detail Modal (iOS Bottom Sheet style) -->
        <div id="product-modal" class="fixed inset-0 z-50 hidden">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onclick="closeProductModal()"></div>
            <div class="absolute bottom-0 w-full bg-white rounded-t-3xl shadow-2xl transition-transform duration-300 transform translate-y-full flex flex-col max-h-[90vh]" id="product-sheet">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mt-3 mb-2"></div>
                <div class="overflow-y-auto px-5 pb-[calc(env(safe-area-inset-bottom)+20px)] pt-2">
                    <img id="modal-img" src="" alt="Product" class="w-full aspect-square object-cover rounded-2xl mb-4 bg-gray-100 border border-gray-100">
                    <h2 id="modal-title" class="text-[24px] font-bold text-gray-900 tracking-tight leading-tight mb-1"></h2>
                    <div id="modal-price" class="text-amber-600 text-[18px] font-bold mb-4"></div>
                    
                    <h3 class="text-[14px] font-semibold text-gray-900 mb-1">Komposisi:</h3>
                    <p id="modal-comp" class="text-[14px] text-gray-600 mb-4 leading-relaxed"></p>

                    <h3 class="text-[14px] font-semibold text-gray-900 mb-1">Catatan Produk:</h3>
                    <p id="modal-desc" class="text-[14px] text-gray-600 mb-6 leading-relaxed"></p>

                    <button onclick="addActiveProductToCart()" class="w-full bg-amber-600 active:bg-amber-700 text-white font-semibold py-4 rounded-2xl transition-colors text-[16px] flex justify-center items-center shadow-md">
                        <i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Tambahkan ke Keranjang
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto pb-safe relative">
            <!-- Toast Notification -->
            <div id="toast" class="toast fixed top-20 left-1/2 transform -translate-x-1/2 ios-blur border border-gray-200/50 text-gray-800 px-5 py-2.5 rounded-full shadow-lg z-50 opacity-0 pointer-events-none text-[14px] font-medium whitespace-nowrap">
                Notifikasi
            </div>

            <!-- VIEW: MENU -->
            <section id="view-menu" class="block w-full px-4 pt-4">
                <h2 class="text-[28px] font-bold tracking-tight text-black mb-4">Pilih Kopi</h2>
                <div id="menu-list" class="space-y-3 mb-6">
                    <div class="text-center py-20 text-gray-400">Memuat...</div>
                </div>
            </section>

            <!-- VIEW: KERANJANG -->
            <section id="view-cart" class="hidden w-full px-4 pt-4">
                <h2 class="text-[28px] font-bold tracking-tight text-black mb-4">Keranjang</h2>
                <div id="cart-list" class="space-y-4 mb-6 min-h-[10vh]">
                    <div class="text-center py-20 text-gray-400">Keranjang kosong.</div>
                </div>

                <div id="checkout-box" class="hidden mb-6 mx-1">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                        <h3 class="font-bold text-gray-900 text-[15px] mb-3 border-b border-gray-100 pb-2">Data Pemesan</h3>
                        <div class="space-y-3">
                            <input type="text" id="cust-name" placeholder="Nama Lengkap" class="w-full bg-gray-50 p-3 rounded-xl text-[14px] outline-none focus:ring-1 focus:ring-amber-500">
                            <input type="tel" id="cust-wa" placeholder="Nomor WhatsApp (Cth: 0812...)" class="w-full bg-gray-50 p-3 rounded-xl text-[14px] outline-none focus:ring-1 focus:ring-amber-500">
                            <textarea id="cust-notes" placeholder="Catatan Pesanan (opsional)" class="w-full bg-gray-50 p-3 rounded-xl text-[14px] outline-none focus:ring-1 focus:ring-amber-500" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4 text-center">
                        <h3 class="font-bold text-gray-900 text-[15px] mb-2">QR Pembayaran</h3>
                        <p class="text-[12px] text-gray-500 mb-3">Scan untuk bayar & kirim bukti via WhatsApp</p>
                        <img id="cart-qr" src="https://placehold.co/200x200/eee/999?text=QR+Belum+Diatur" alt="QRIS" class="w-[200px] h-[200px] mx-auto object-cover rounded-xl mb-2 shadow-sm border border-gray-200">
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">
                        <div class="flex justify-between text-[14px] mb-2 text-gray-500 font-medium">
                            <span>Subtotal</span>
                            <span id="cart-subtotal">Rp 0</span>
                        </div>
                        <div class="flex justify-between text-[18px] font-bold mb-4 text-gray-900">
                            <span>Total</span>
                            <span id="cart-total" class="text-amber-600">Rp 0</span>
                        </div>
                        <button id="btn-checkout" class="w-full bg-[#25D366] active:bg-[#128C7E] text-white font-semibold py-4 rounded-[14px] shadow-sm transition-colors flex justify-center items-center text-[16px]">
                            <i data-lucide="message-circle" class="w-5 h-5 mr-2"></i>
                            Pesan via WhatsApp
                        </button>
                    </div>
                </div>
            </section>

            <!-- VIEW: PESANAN -->
            <section id="view-orders" class="hidden w-full px-4 pt-4">
                <h2 class="text-[28px] font-bold tracking-tight text-black mb-4">Pesanan Anda</h2>
                
                <div class="bg-amber-50/80 border border-amber-200/50 p-4 rounded-2xl mb-5 flex flex-col items-start mx-1 gap-1.5">
                    <div class="flex items-center text-amber-900 font-semibold text-[14px]">
                        <i data-lucide="map-pin" class="w-4 h-4 mr-1.5 text-amber-600"></i> Lokasi Toko
                    </div>
                    <p id="store-location" class="text-[13px] text-amber-800/80 leading-relaxed">Memuat lokasi...</p>
                </div>

                <div id="orders-list" class="space-y-4">
                    <!-- Orders will go here -->
                </div>

                <button onclick="contactAdmin()" class="w-full mt-6 mb-8 bg-white border border-gray-200 text-gray-800 font-semibold py-3.5 rounded-[14px] shadow-sm active:bg-gray-50 transition-colors flex justify-center items-center text-[15px] mx-1">
                    <i data-lucide="headphones" class="w-5 h-5 mr-2 text-gray-500"></i> Tanya Admin (WhatsApp)
                </button>
            </section>

        </main>

        <!-- Bottom Navigation -->
        <nav class="ios-blur border-t border-gray-200/50 fixed bottom-0 w-full max-w-[480px] pb-[calc(env(safe-area-inset-bottom)+10px)] z-20 flex justify-around items-center pt-2 px-2 shadow-none rounded-none">
            <button onclick="switchTab('menu')" id="nav-menu" class="nav-btn flex flex-col items-center p-2 text-amber-600 transition-colors w-1/3">
                <i data-lucide="coffee" class="w-6 h-6 mb-1 stroke-[1.5]"></i>
                <span class="text-[10px] font-medium tracking-wide">Menu</span>
            </button>
            <button onclick="switchTab('cart')" id="nav-cart" class="nav-btn flex flex-col items-center p-2 text-gray-400 hover:text-amber-600 transition-colors relative w-1/3">
                <div class="relative">
                    <i data-lucide="shopping-bag" class="w-6 h-6 mb-1 stroke-[1.5]"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden border-2 border-white">0</span>
                </div>
                <span class="text-[10px] font-medium tracking-wide">Keranjang</span>
            </button>
            <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn flex flex-col items-center p-2 text-gray-400 hover:text-amber-600 transition-colors w-1/3">
                <i data-lucide="clipboard-list" class="w-6 h-6 mb-1 stroke-[1.5]"></i>
                <span class="text-[10px] font-medium tracking-wide">Pesanan</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBLCeuWhOiOCPV7lWfbW4eSsjwbUmb3c8",
            authDomain: "aplikasi-coffee.firebaseapp.com",
            projectId: "aplikasi-coffee",
            storageBucket: "aplikasi-coffee.firebasestorage.app",
            messagingSenderId: "847017187499",
            appId: "1:847017187499:web:f180c9da28725d50f6ffee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ID yang sama dengan aplikasi admin
        const sysAppId = 'ay-coffee-shared-db';
        
        let currentUser = null;
        let menuItems = [];
        let cart = [];
        let userOrders = [];
        let storeSettings = {};
        let activeProduct = null;

        lucide.createIcons();

        const formatIDR = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        const showToast = (message) => {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 10px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 3000);
        };

        window.switchTab = (tabId) => {
            document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-amber-600');
                btn.classList.add('text-gray-400');
            });

            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tabId}`).classList.add('text-amber-600');
        };

        const initAuth = async () => {
            try { await signInAnonymously(auth); } 
            catch (error) { showToast("Gagal terhubung."); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadSettings();
                loadMenuData();
                loadOrdersData();
            } else { currentUser = null; }
        });

        // Load pengaturan dari admin (Lokasi & QR)
        const loadSettings = () => {
            const docRef = doc(db, 'artifacts', sysAppId, 'public', 'data', 'settings', 'store_settings');
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    storeSettings = docSnap.data();
                    document.getElementById('store-location').textContent = storeSettings.lokasi || 'Lokasi belum diatur admin.';
                    if(storeSettings.qrCode) {
                        document.getElementById('cart-qr').src = storeSettings.qrCode;
                    }
                }
            });
        };

        window.contactAdmin = () => {
            if(!storeSettings || !storeSettings.whatsapp) {
                showToast("Nomor WA Admin belum diatur.");
                return;
            }
            // Format WA: Hapus angka 0 di depan, ganti dengan 62
            let waNum = storeSettings.whatsapp.replace(/^0+/, '62');
            window.open(`https://wa.me/${waNum}?text=Halo%20Admin%20Ay&%20Coffee,`, '_blank');
        };

        const loadMenuData = () => {
            if (!currentUser) return;
            const menuRef = collection(db, 'artifacts', sysAppId, 'public', 'data', 'menu');
            onSnapshot(menuRef, (snapshot) => {
                menuItems = [];
                snapshot.forEach(doc => menuItems.push({ id: doc.id, ...doc.data() }));
                renderMenu();
            });
        };

        const renderMenu = () => {
            const menuContainer = document.getElementById('menu-list');
            if (menuItems.length === 0) {
                menuContainer.innerHTML = `<div class="text-center py-20 text-gray-400">Menu belum tersedia.</div>`;
                return;
            }

            menuContainer.innerHTML = '';
            menuItems.forEach(item => {
                let priceHtml = '';
                if(item.hargaPromo && item.hargaPromo > 0) {
                    priceHtml = `<span class="text-gray-400 line-through text-[12px] mr-1">${formatIDR(item.harga)}</span><span class="font-medium text-amber-600 text-[15px]">${formatIDR(item.hargaPromo)}</span>`;
                } else {
                    priceHtml = `<span class="font-medium text-amber-600 text-[15px]">${formatIDR(item.harga)}</span>`;
                }
                
                const imgUrl = item.image || 'https://placehold.co/150x150/eee/999?text=No+Image';

                const el = document.createElement('div');
                el.className = "bg-white p-3 rounded-[20px] shadow-sm flex items-center active:scale-[0.98] transition-transform cursor-pointer mx-1 border border-transparent hover:border-gray-100";
                el.onclick = () => openProductModal(item.id);
                el.innerHTML = `
                    <img src="${imgUrl}" class="w-[80px] h-[80px] rounded-[14px] object-cover mr-4 bg-gray-50 border border-gray-100/80">
                    <div class="flex-1 pr-1">
                        <h3 class="font-semibold text-gray-900 text-[16px] tracking-tight mb-0.5">${item.nama}</h3>
                        <div class="mb-1">${priceHtml}</div>
                        <p class="text-[12px] text-gray-500 line-clamp-1 leading-tight">${item.deskripsi || item.catatan || 'Kopi nikmat khas Ay&'}</p>
                    </div>
                `;
                menuContainer.appendChild(el);
            });
            lucide.createIcons();
        };

        window.openProductModal = (id) => {
            const item = menuItems.find(i => i.id === id);
            if(!item) return;
            activeProduct = item;

            document.getElementById('modal-img').src = item.image || 'https://placehold.co/400x400/eee/999?text=No+Image';
            document.getElementById('modal-title').textContent = item.nama;
            
            if(item.hargaPromo && item.hargaPromo > 0) {
                document.getElementById('modal-price').innerHTML = `<span class="text-gray-400 line-through text-[14px] mr-2">${formatIDR(item.harga)}</span>${formatIDR(item.hargaPromo)}`;
            } else {
                document.getElementById('modal-price').textContent = formatIDR(item.harga);
            }

            document.getElementById('modal-comp').textContent = item.komposisi || 'Belum ada data komposisi.';
            document.getElementById('modal-desc').textContent = item.catatan || 'Tidak ada catatan produk.';

            const modal = document.getElementById('product-modal');
            const sheet = document.getElementById('product-sheet');
            
            modal.classList.remove('hidden');
            setTimeout(() => { sheet.classList.remove('translate-y-full'); }, 10);
        };

        window.closeProductModal = () => {
            const modal = document.getElementById('product-modal');
            const sheet = document.getElementById('product-sheet');
            
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                activeProduct = null;
            }, 300);
        };

        window.addActiveProductToCart = () => {
            if(!activeProduct) return;
            addToCart(activeProduct.id);
            closeProductModal();
        };

        window.addToCart = (itemId) => {
            const item = menuItems.find(i => i.id === itemId);
            if (!item) return;

            const existing = cart.find(i => i.id === itemId);
            if (existing) existing.qty += 1;
            else cart.push({ ...item, qty: 1 });
            
            updateCartUI();
            showToast(`${item.nama} ditambahkan!`);
        };

        window.updateQty = (itemId, change) => {
            const itemIndex = cart.findIndex(i => i.id === itemId);
            if (itemIndex > -1) {
                cart[itemIndex].qty += change;
                if (cart[itemIndex].qty <= 0) cart.splice(itemIndex, 1);
                updateCartUI();
            }
        };

        const updateCartUI = () => {
            const badge = document.getElementById('cart-badge');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            
            if (totalQty > 0) {
                badge.textContent = totalQty;
                badge.classList.remove('hidden');
            } else { badge.classList.add('hidden'); }

            const cartList = document.getElementById('cart-list');
            const checkoutBox = document.getElementById('checkout-box');
            
            if (cart.length === 0) {
                cartList.innerHTML = `<div class="text-center py-20 text-gray-400 flex flex-col items-center"><i data-lucide="shopping-cart" class="w-12 h-12 mb-3 opacity-50"></i>Keranjang kosong.</div>`;
                checkoutBox.classList.add('hidden');
                lucide.createIcons();
                return;
            }

            checkoutBox.classList.remove('hidden');
            cartList.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const activePrice = item.hargaPromo && item.hargaPromo > 0 ? item.hargaPromo : item.harga;
                total += activePrice * item.qty;
                
                const el = document.createElement('div');
                el.className = "flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm mb-3 mx-1 border border-gray-100";
                el.innerHTML = `
                    <div class="flex-1 pr-3">
                        <h4 class="font-semibold text-[15px] text-gray-900 tracking-tight leading-tight">${item.nama}</h4>
                        <div class="text-amber-600 font-medium text-[13px] mt-1">${formatIDR(activePrice)}</div>
                    </div>
                    <div class="flex items-center bg-gray-100/80 rounded-full p-1">
                        <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center text-gray-700 active:bg-gray-300 rounded-full transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                        <span class="w-6 text-center text-[14px] font-semibold">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center text-gray-700 active:bg-gray-300 rounded-full transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                `;
                cartList.appendChild(el);
            });

            document.getElementById('cart-subtotal').textContent = formatIDR(total);
            document.getElementById('cart-total').textContent = formatIDR(total);
            lucide.createIcons();
        };

        // Checkout logic & WhatsApp Redirect
        document.getElementById('btn-checkout').addEventListener('click', async () => {
            if (!currentUser || cart.length === 0) return;

            const custName = document.getElementById('cust-name').value.trim();
            const custWa = document.getElementById('cust-wa').value.trim();
            const custNotes = document.getElementById('cust-notes').value.trim();

            if(!custName || !custWa) {
                showToast("Nama dan Nomor WA wajib diisi!");
                return;
            }

            const btn = document.getElementById('btn-checkout');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 mr-2 animate-spin"></i> Memproses...`;
            btn.disabled = true;

            const total = cart.reduce((sum, item) => sum + ((item.hargaPromo || item.harga) * item.qty), 0);
            
            const orderData = {
                userId: currentUser.uid,
                namaCustomer: custName,
                whatsappCustomer: custWa,
                catatan: custNotes,
                items: cart,
                total: total,
                status: 'Menunggu',
                waktu: new Date().toISOString(),
            };

            try {
                const ordersRef = collection(db, 'artifacts', sysAppId, 'public', 'data', 'orders');
                const newOrder = await addDoc(ordersRef, orderData);
                
                let itemsText = cart.map(i => `- ${i.qty}x ${i.nama}`).join('\n');
                let waMsg = `Halo Ay& Coffee,\nSaya ingin pesan:\n\n*ID Order:* ${newOrder.id.slice(0,6).toUpperCase()}\n*Nama:* ${custName}\n*No WA:* ${custWa}\n\n*Pesanan:*\n${itemsText}\n\n*Total:* ${formatIDR(total)}\n*Catatan:* ${custNotes || '-'}\n\nPembayaran via QRIS telah diproses. Berikut bukti transfernya (silakan lampirkan gambar). Mohon konfirmasi pesanan saya ya.`;
                
                cart = [];
                document.getElementById('cust-notes').value = '';
                updateCartUI();
                showToast("Pesanan dibuat! Membuka WA...");
                switchTab('orders');
                
                setTimeout(() => {
                    if(storeSettings && storeSettings.whatsapp) {
                        let waNum = storeSettings.whatsapp.replace(/^0+/, '62');
                        window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}`, '_blank');
                    } else {
                        showToast("Nomor WA Admin belum di-set.");
                    }
                }, 1000);

            } catch (error) {
                showToast("Gagal memproses pesanan.");
            } finally {
                btn.innerHTML = `<i data-lucide="message-circle" class="w-5 h-5 mr-2"></i> Pesan via WhatsApp`;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        const loadOrdersData = () => {
            if (!currentUser) return;
            const ordersRef = collection(db, 'artifacts', sysAppId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                userOrders = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.userId === currentUser.uid) userOrders.push({ id: doc.id, ...data });
                });
                userOrders.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
                renderOrders();
            });
        };

        const renderOrders = () => {
            const container = document.getElementById('orders-list');
            if (userOrders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-400 flex flex-col items-center"><i data-lucide="clipboard-list" class="w-12 h-12 mb-3 opacity-50"></i>Belum ada riwayat pesanan.</div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';
            userOrders.forEach(order => {
                let statusColor = "bg-gray-100 text-gray-600";
                let statusIcon = "clock";
                
                if (order.status === 'Diproses') { statusColor = "bg-blue-100 text-blue-700"; statusIcon = "chef-hat"; }
                if (order.status === 'Siap Diambil') { statusColor = "bg-green-100 text-green-700"; statusIcon = "check-circle-2"; }
                if (order.status === 'Selesai') { statusColor = "bg-gray-100 text-gray-500"; statusIcon = "check"; }

                const d = new Date(order.waktu);
                const timeStr = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                let itemsText = order.items.map(i => `<span class="font-medium">${i.qty}x</span> ${i.nama}`).join('<br>');

                const el = document.createElement('div');
                el.className = "bg-white p-4 rounded-2xl shadow-sm mb-4 mx-1 relative overflow-hidden border border-gray-100";
                el.innerHTML = `
                    <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                        <div class="text-[13px] text-gray-500 font-medium">#${order.id.slice(0,6).toUpperCase()} • ${timeStr}</div>
                        <div class="px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center ${statusColor}">
                            <i data-lucide="${statusIcon}" class="w-3.5 h-3.5 mr-1 stroke-[2.5]"></i> ${order.status}
                        </div>
                    </div>
                    <p class="text-[14px] text-gray-800 leading-relaxed mb-3">${itemsText}</p>
                    <div class="flex justify-between items-center pt-1">
                        <span class="text-[13px] text-gray-500 font-medium">Total</span>
                        <span class="font-bold text-[15px] text-amber-600">${formatIDR(order.total)}</span>
                    </div>
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        };

        initAuth();
    </script>
</body>
</html>
